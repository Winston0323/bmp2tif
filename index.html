<body>
  <div class="page">
    <h1>BMP 转 TIFF 在线转换器</h1>

    <div id="flash" class="flash" style="display:none"></div>

    <div id="dropZone" class="drop-zone">
      点击此处或拖拽 BMP 文件到此区域。
    </div>

    <div class="actions">
      <input id="fileInput" type="file" accept=".bmp,image/bmp" multiple />
      <div class="field-group radio-group">
        <span>压缩模式</span>
        <div class="compression-options">
          <label class="radio-button">
            <input type="radio" name="compressionMode" value="NONE" checked />
            NONE
          </label>
          <label class="radio-button">
            <input type="radio" name="compressionMode" value="LZW" />
            LZW
          </label>
          <label class="radio-button">
            <input type="radio" name="compressionMode" value="ZIP" />
            ZIP
          </label>
          <label class="radio-button">
            <input type="radio" name="compressionMode" value="JPEG" />
            JPEG
          </label>
        </div>
      </div>
      <div class="field-group radio-group">
        <span>像素排列</span>
        <div class="compression-options">
          <label class="radio-button">
            <input type="radio" name="pixelOrder" value="INTERLEAVED" checked />
            RGBRGB（Interleaved）
          </label>
          <label class="radio-button">
            <input type="radio" name="pixelOrder" value="PERCHANNEL" />
            RRR...GGG...BBB...（Per-channel）
          </label>
        </div>
        <div class="info-wrapper">
          <button type="button" class="info-button" aria-label="像素排列说明">i</button>
          <div class="info-tooltip">像素排列决定像素存储顺序，对后续图像处理管线影响较大。Interleaved 适合标准显示与常见 RGB 图像，Per-channel 适合专业 TIFF 分通道处理或单通道后处理流程。</div>
        </div>
      </div>
      <div class="field-group" id="jpegQualityGroup">
        <label for="jpegQuality">JPEG 质量</label>
        <input id="jpegQuality" type="range" min="4" max="12" step="1" value="12" />
        <div class="range-value" id="jpegQualityValue">12</div>
      </div>
      <div class="field-group">
        <label for="threadCount">线程数</label>
        <input id="threadCount" type="range" min="1" max="16" step="1" value="4" />
        <div class="range-value" id="threadCountValue">4</div>
      </div>
      <button id="convertBtn" type="button" disabled>开始转换</button>
    </div>

    <div class="progress-container" id="uploadProgressContainer" style="display:none;">
      <div class="progress-bar-wrapper">
        <div id="uploadProgressBar" class="progress-bar" role="progressbar" aria-valuemin="0" aria-valuemax="100"></div>
      </div>
      <div id="uploadProgressText" class="progress-text">等待上传...</div>
    </div>
    <div class="progress-container" id="progressContainer" style="display:none;">
      <div class="progress-bar-wrapper">
        <div id="progressBar" class="progress-bar" role="progressbar" aria-valuemin="0" aria-valuemax="100"></div>
      </div>
      <div id="progressText" class="progress-text">准备中...</div>
    </div>

    <ul id="fileList" class="file-list"></ul>

    <div id="result" class="result"></div>

    <footer>支持 BMP 格式文件，转换后会生成 TIFF 文件并打包为 ZIP。</footer>
  </div>

  <script>
    const fileInput = document.getElementById('fileInput');
    const jpegQualityGroup = document.getElementById('jpegQualityGroup');
    const jpegQuality = document.getElementById('jpegQuality');
    const jpegQualityValue = document.getElementById('jpegQualityValue');
    const convertBtn = document.getElementById('convertBtn');
    const fileList = document.getElementById('fileList');
    const result = document.getElementById('result');
    const flash = document.getElementById('flash');
    const dropZone = document.getElementById('dropZone');
    const progressContainer = document.getElementById('progressContainer');
    const progressBar = document.getElementById('progressBar');
    const progressText = document.getElementById('progressText');
    const uploadProgressContainer = document.getElementById('uploadProgressContainer');
    const uploadProgressBar = document.getElementById('uploadProgressBar');
    const uploadProgressText = document.getElementById('uploadProgressText');

    let files = [];

    function getCompressionMode() {
      const selected = document.querySelector('input[name="compressionMode"]:checked');
      return selected ? selected.value : 'NONE';
    }

    function getPixelOrder() {
      const selected = document.querySelector('input[name="pixelOrder"]:checked');
      return selected ? selected.value : 'INTERLEAVED';
    }

    function updateCompressionUI() {
      const mode = getCompressionMode();
      const isJpeg = mode === 'JPEG';
      jpegQuality.disabled = !isJpeg;
      jpegQualityGroup.style.opacity = isJpeg ? '1' : '0.45';
      jpegQualityGroup.style.pointerEvents = isJpeg ? 'auto' : 'none';
    }

    function getJpegBlob(canvas, quality) {
      return new Promise((resolve, reject) => {
        canvas.toBlob(blob => {
          if (blob) resolve(blob);
          else reject(new Error('无法生成 JPEG 图像'));
        }, 'image/jpeg', quality);
      });
    }

    function packTiffWithCompression(baseBuffer, compressedBytes) {
      const header = new Uint8Array(baseBuffer, 0, 1000);
      const output = new Uint8Array(1000 + compressedBytes.length);
      output.set(header, 0);
      output.set(compressedBytes, 1000);
      const dv = new DataView(output.buffer);
      const tagCount = dv.getUint16(8, false);
      let entryOffset = 10;
      for (let i = 0; i < tagCount; i++) {
        const tag = dv.getUint16(entryOffset, false);
        const type = dv.getUint16(entryOffset + 2, false);
        const count = dv.getUint32(entryOffset + 4, false);
        if (tag === 279 && type === 4 && count === 1) {
          dv.setUint32(entryOffset + 8, compressedBytes.length, false);
          break;
        }
        entryOffset += 12;
      }
      return output.buffer;
    }

    function compressLZW(rawBytes) {
      const dict = new Map();
      for (let i = 0; i < 256; i++) {
        dict.set(String.fromCharCode(i), i);
      }
      let nextCode = 258;
      let prefix = '';
      const codes = [];
      codes.push(256);
      for (let i = 0; i < rawBytes.length; i++) {
        const char = String.fromCharCode(rawBytes[i]);
        const candidate = prefix + char;
        if (dict.has(candidate)) {
          prefix = candidate;
        } else {
          codes.push(dict.get(prefix));
          if (nextCode < 4096) {
            dict.set(candidate, nextCode++);
          } else {
            codes.push(256);
            dict.clear();
            for (let j = 0; j < 256; j++) dict.set(String.fromCharCode(j), j);
            nextCode = 258;
            dict.set(candidate, nextCode++);
          }
          prefix = char;
        }
      }
      if (prefix !== '') {
        codes.push(dict.get(prefix));
      }
      codes.push(257);
      const bytes = [];
      let bitBuffer = 0;
      let bitCount = 0;
      for (const code of codes) {
        bitBuffer |= code << bitCount;
        bitCount += 12;
        while (bitCount >= 8) {
          bytes.push(bitBuffer & 0xff);
          bitBuffer >>= 8;
          bitCount -= 8;
        }
      }
      if (bitCount > 0) {
        bytes.push(bitBuffer & 0xff);
      }
      return new Uint8Array(bytes);
    }

    async function createTiffBlob(file) {
      const bitmap = await createImageBitmap(file);
      const canvas = document.createElement('canvas');
      canvas.width = bitmap.width;
      canvas.height = bitmap.height;
      const ctx = canvas.getContext('2d');
      ctx.drawImage(bitmap, 0, 0);
      const imageData = ctx.getImageData(0, 0, canvas.width, canvas.height);
      const mode = getCompressionMode();
      const pixelOrder = getPixelOrder();
      const quality = Number(jpegQuality.value);
      const metadata = {
        t305: ['BMP2TIFF Converter'],
        t274: [1],
        t273: [1000],
        t278: [canvas.height],
        t282: [1],
        t283: [1],
        t286: [0],
        t287: [0],
        t296: [1]
      };

      if (mode === 'JPEG') {
        metadata.t259 = [6];
        metadata.t262 = [6];
        metadata.t258 = [8, 8, 8];
        metadata.t277 = [3];
      } else {
        metadata.t262 = [2];
        metadata.t258 = [8, 8, 8, 8];
        metadata.t277 = pixelOrder === 'PERCHANNEL' ? [2] : [1];
        if (mode === 'LZW') metadata.t259 = [5];
        if (mode === 'ZIP') metadata.t259 = [8];
        if (mode === 'NONE') metadata.t259 = [1];
      }

      const rawBuffer = UTIF.encodeImage(imageData.data.buffer, canvas.width, canvas.height, metadata);
      const rawBytes = new Uint8Array(rawBuffer);
      if (mode === 'NONE') {
        return new Blob([rawBytes], { type: 'image/tiff' });
      }

      if (mode === 'ZIP' || mode === 'LZW') {
        const sourceBytes = rawBytes.subarray(1000, 1000 + canvas.width * canvas.height * 4);
        const compressed = mode === 'ZIP'
          ? pako.deflate(sourceBytes)
          : compressLZW(sourceBytes);
        const packed = packTiffWithCompression(rawBuffer, compressed);
        return new Blob([packed], { type: 'image/tiff' });
      }

      if (mode === 'JPEG') {
        const jpegBlob = await getJpegBlob(canvas, quality / 12);
        const jpegBytes = new Uint8Array(await jpegBlob.arrayBuffer());
        const packed = packTiffWithCompression(rawBuffer, jpegBytes);
        return new Blob([packed], { type: 'image/tiff' });
      }

      return new Blob([rawBytes], { type: 'image/tiff' });
    }

    function showMessage(text, isError = false) {
      flash.textContent = text;
      flash.style.display = 'block';
      if (isError) {
        flash.style.background = 'rgba(248, 113, 113, 0.18)';
        flash.style.borderColor = 'rgba(248, 113, 113, 0.35)';
        flash.style.color = '#ffe4e6';
      } else {
        flash.style.background = 'rgba(56, 189, 248, 0.12)';
        flash.style.borderColor = 'rgba(56, 189, 248, 0.4)';
        flash.style.color = '#dbeafe';
      }
    }

    function clearMessage() {
      flash.style.display = 'none';
    }

    function updateFileList(selectedFiles) {
      fileList.innerHTML = '';
      result.innerHTML = '';
      clearMessage();

      if (!selectedFiles.length) {
        convertBtn.disabled = true;
        showMessage('请先选择一个或多个 BMP 文件。', true);
        return;
      }

      selectedFiles.forEach(file => {
        const li = document.createElement('li');
        li.textContent = `${file.name} (${Math.round(file.size / 1024)} KB)`;
        fileList.appendChild(li);
      });

      convertBtn.disabled = false;
    }

    function filterBmpFiles(fileArray) {
      return fileArray.filter(file => file.name.toLowerCase().endsWith('.bmp'));
    }

    async function handleFileInputChange(event) {
      const chosen = Array.from(event.target.files || []);
      files = filterBmpFiles(chosen);
      updateFileList(files);
    }

    async function getDroppedFiles(dataTransfer) {
      const items = Array.from(dataTransfer.items || []);
      if (items.length === 0) {
        return Array.from(dataTransfer.files || []);
      }

      const entries = items
        .map(item => item.webkitGetAsEntry ? item.webkitGetAsEntry() : null)
        .filter(Boolean);

      const allFiles = [];
      async function traverseEntry(entry, path = '') {
        if (entry.isFile) {
          return new Promise(resolve => entry.file(file => {
            file.fullPath = path + file.name;
            resolve(file);
          }));
        }
        if (entry.isDirectory) {
          const reader = entry.createReader();
          return new Promise(resolve => {
            reader.readEntries(async entries => {
              const nestedPromises = entries.map(child => traverseEntry(child, path + entry.name + '/'));
              const nestedFiles = await Promise.all(nestedPromises);
              resolve(nestedFiles.flat());
            });
          });
        }
        return [];
      }

      for (const entry of entries) {
        const found = await traverseEntry(entry);
        allFiles.push(...found.flat());
      }

      return allFiles.length ? allFiles : Array.from(dataTransfer.files || []);
    }

    dropZone.addEventListener('dragenter', event => {
      event.preventDefault();
      dropZone.classList.add('drag-over');
    });

    dropZone.addEventListener('click', () => {
      fileInput.click();
    });

    dropZone.addEventListener('dragover', event => {
      event.preventDefault();
      dropZone.classList.add('drag-over');
    });

    dropZone.addEventListener('dragleave', () => {
      dropZone.classList.remove('drag-over');
    });

    dropZone.addEventListener('drop', async event => {
      event.preventDefault();
      dropZone.classList.remove('drag-over');
      const droppedFiles = await getDroppedFiles(event.dataTransfer);
      files = filterBmpFiles(droppedFiles);
      if (!files.length) {
        convertBtn.disabled = true;
        showMessage('未找到 BMP 文件，请拖拽 BMP 文件。', true);
        fileList.innerHTML = '';
        result.innerHTML = '';
        return;
      }
      updateFileList(files);
    });

    fileInput.addEventListener('change', handleFileInputChange);
    document.querySelectorAll('input[name="compressionMode"]').forEach(radio => {
      radio.addEventListener('change', updateCompressionUI);
    });
    jpegQuality.addEventListener('input', () => {
      jpegQualityValue.textContent = jpegQuality.value;
    });

    const threadCountSlider = document.getElementById('threadCount');
    const threadCountValue = document.getElementById('threadCountValue');
    const hardwareThreads = navigator.hardwareConcurrency || 4;
    threadCountSlider.max = hardwareThreads;
    threadCountSlider.value = hardwareThreads;
    threadCountValue.textContent = hardwareThreads;
    threadCountSlider.addEventListener('input', () => {
      threadCountValue.textContent = threadCountSlider.value;
    });

    updateCompressionUI();

    const workerSource = `importScripts('https://cdn.jsdelivr.net/npm/pako@2.1.0/dist/pako.min.js','https://cdn.jsdelivr.net/npm/utif@3.0.0/UTIF.min.js');

function packTiffWithCompression(baseBuffer, compressedBytes) {
  const header = new Uint8Array(baseBuffer, 0, 1000);
  const output = new Uint8Array(1000 + compressedBytes.length);
  output.set(header, 0);
  output.set(compressedBytes, 1000);
  const dv = new DataView(output.buffer);
  const tagCount = dv.getUint16(8, false);
  let entryOffset = 10;
  for (let i = 0; i < tagCount; i++) {
    const tag = dv.getUint16(entryOffset, false);
    const type = dv.getUint16(entryOffset + 2, false);
    const count = dv.getUint32(entryOffset + 4, false);
    if (tag === 279 && type === 4 && count === 1) {
      dv.setUint32(entryOffset + 8, compressedBytes.length, false);
      break;
    }
    entryOffset += 12;
  }
  return output.buffer;
}

  const codes = [];
  codes.push(256);

    if (dict.has(candidate)) {
      prefix = candidate;

        dict.set(candidate, nextCode++);
      } else {
        codes.push(256);
        dict.clear();
        for (let j = 0; j < 256; j++) dict.set(String.fromCharCode(j), j);
        nextCode = 258;
        dict.set(candidate, nextCode++);
      }
      prefix = char;
    }
  }
  if (prefix !== '') {
    codes.push(dict.get(prefix));
  }
  codes.push(257);
  const bytes = [];
  let bitBuffer = 0;
  let bitCount = 0;
  for (const code of codes) {
    bitBuffer |= code << bitCount;
    bitCount += 12;
    while (bitCount >= 8) {
      bytes.push(bitBuffer & 0xff);
      bitBuffer >>= 8;
      bitCount -= 8;
    }
  }
  if (bitCount > 0) {
    bytes.push(bitBuffer & 0xff);
  }
  return new Uint8Array(bytes);
}

self.onmessage = async function(event) {
  const { file, mode, quality, pixelOrder } = event.data;
  try {
    const bitmap = await createImageBitmap(file);
    const width = bitmap.width;
    const height = bitmap.height;
    const canvas = new OffscreenCanvas(width, height);
    const ctx = canvas.getContext('2d');
    ctx.drawImage(bitmap, 0, 0);
    const imageData = ctx.getImageData(0, 0, width, height);
    const metadata = {
      t305: ['BMP2TIFF Converter'],
      t274: [1],
      t273: [1000],
      t278: [height],
      t282: [1],
      t283: [1],
      t286: [0],
      t287: [0],
      t296: [1]
    };

    if (mode === 'JPEG') {
      metadata.t259 = [6];
      metadata.t262 = [6];
      metadata.t258 = [8, 8, 8];
      metadata.t277 = [3];
    } else {
      metadata.t262 = [2];
      metadata.t258 = [8, 8, 8, 8];
      metadata.t277 = pixelOrder === 'PERCHANNEL' ? [2] : [1];
      if (mode === 'LZW') metadata.t259 = [5];
      if (mode === 'ZIP') metadata.t259 = [8];
      if (mode === 'NONE') metadata.t259 = [1];
    }

    const rawBuffer = UTIF.encodeImage(imageData.data.buffer, width, height, metadata);
    if (mode === 'NONE') {
      self.postMessage({ success: true, buffer: rawBuffer }, [rawBuffer]);
      return;
    }

    let compressed;
    if (mode === 'JPEG') {
      const jpegBlob = await canvas.convertToBlob({ type: 'image/jpeg', quality: Math.max(0.01, Math.min(1, quality / 12)) });
      compressed = new Uint8Array(await jpegBlob.arrayBuffer());
    } else {
      const sourceBytes = new Uint8Array(rawBuffer, 1000, width * height * 4);
      compressed = mode === 'ZIP' ? pako.deflate(sourceBytes) : compressLZW(sourceBytes);
    }

    const packed = packTiffWithCompression(rawBuffer, compressed);
    self.postMessage({ success: true, buffer: packed }, [packed]);
  } catch (error) {
    self.postMessage({ success: false, error: error.message || 'Worker 转换失败' });
  }
};
`;
    const workerUrl = URL.createObjectURL(new Blob([workerSource], { type: 'application/javascript' }));

    function createWorker() {
      return new Worker(workerUrl);
    }

    function processFileWithWorker(file) {
      return new Promise(resolve => {
        let worker;
        try {
          worker = createWorker();
        } catch (error) {
          resolve({ success: false, buffer: null, error: error.message || '无法创建 Worker' });
          return;
        }

        const cleanup = () => {
          if (worker) {
            worker.terminate();
            worker = null;
          }
          clearTimeout(timeoutId);
        };

        const timeoutId = setTimeout(() => {
          cleanup();
          resolve({ success: false, buffer: null, error: 'Worker 超时' });
        }, 20000);

        worker.onmessage = ({ data }) => {
          cleanup();
          if (data.success) {
            resolve({ success: true, buffer: data.buffer, error: null });
          } else {
            resolve({ success: false, buffer: null, error: data.error || '转换失败' });
          }
        };
        worker.onerror = errorEvent => {
          cleanup();
          resolve({ success: false, buffer: null, error: errorEvent.message || 'Worker 运行错误' });
        };

        try {
          worker.postMessage({ file, mode: getCompressionMode(), quality: Number(jpegQuality.value), pixelOrder: getPixelOrder() });
        } catch (error) {
          cleanup();
          resolve({ success: false, buffer: null, error: error.message || 'Worker postMessage 失败' });
        }
      });
    }

    async function convertFilesInMainThread(files) {
      const total = files.length;
      const results = new Array(total);

      for (let index = 0; index < total; index++) {
        const file = files[index];
        const percent = Math.round((index / total) * 100);
        setProgress(percent, `主线程转换 ${index + 1}/${total}: ${file.name}`);
        setUploadProgress(percent, `上传进度 ${index + 1}/${total}`);
        try {
          const tifBlob = await createTiffBlob(file);
          const buffer = await tifBlob.arrayBuffer();
          results[index] = { success: true, buffer, error: null };
        } catch (error) {
          results[index] = { success: false, buffer: null, error: error.message || '主线程转换失败' };
        }
      }

      setProgress(100, '主线程转换完成');
      return results;
    }

    async function convertFilesInParallel(files) {
      const total = files.length;
      const threadCount = Math.min(Number(threadCountSlider.value), total);
      let nextIndex = 0;
      let completed = 0;
      const results = new Array(total);
      let activeCount = 0;

      return new Promise(resolve => {
        function startNext() {
          while (activeCount < threadCount && nextIndex < total) {
            const index = nextIndex++;
            const file = files[index];
            activeCount += 1;
            processFileWithWorker(file).then(result => {
              completed += 1;
              activeCount -= 1;
              results[index] = result;
              const percent = Math.round((completed / total) * 100);
              setProgress(percent, `转换中 ${completed}/${total}: ${file.name}`);
              setUploadProgress(percent, `上传进度 ${completed}/${total}`);
              startNext();
              if (completed === total) {
                resolve(results);
              }
            });
          }
        }
        startNext();
      });
    }

    function resetProgress() {
      progressContainer.style.display = 'none';
      progressBar.style.width = '0%';
      progressBar.setAttribute('aria-valuenow', '0');
      progressText.textContent = '';
      uploadProgressContainer.style.display = 'none';
      uploadProgressBar.style.width = '0%';
      uploadProgressBar.setAttribute('aria-valuenow', '0');
      uploadProgressText.textContent = '';
    }

    function setProgress(percent, text) {
      progressContainer.style.display = 'block';
      progressBar.style.width = `${percent}%`;
      progressBar.setAttribute('aria-valuenow', percent.toFixed(0));
      progressText.textContent = text;
    }

    function setUploadProgress(percent, text) {
      uploadProgressContainer.style.display = 'block';
      uploadProgressBar.style.width = `${percent}%`;
      uploadProgressBar.setAttribute('aria-valuenow', percent.toFixed(0));
      uploadProgressText.textContent = text;
    }

    convertBtn.addEventListener('click', async () => {
      if (files.length === 0) {
        showMessage('请先选择 BMP 文件。', true);
        return;
      }

      convertBtn.disabled = true;
      fileInput.disabled = true;
      clearMessage();
      result.innerHTML = '';
      resetProgress();
      const threadCount = Math.min(Number(threadCountSlider.value), files.length);
      setProgress(0, `准备转换 ${files.length} 个文件，使用 ${threadCount} 线程...`);
      setUploadProgress(0, '准备上传...');

      const zip = new JSZip();
      let convertedCount = 0;
      const reportLines = [];
      let conversionResults;

      try {
        conversionResults = await convertFilesInParallel(files);
        if (conversionResults.every(res => !res.success)) {
          throw new Error('所有线程转换失败');
        }
      } catch (error) {
        showMessage(`多线程转换失败，回退到单线程：${error.message}`, true);
        conversionResults = await convertFilesInMainThread(files);
      }

      conversionResults.forEach((res, index) => {
        const file = files[index];
        const name = file.name.replace(/\.bmp$/i, '.tif');
        if (res.success) {
          zip.file(name, new Blob([res.buffer], { type: 'image/tiff' }));
          convertedCount += 1;
          reportLines.push(`✔ ${name}`);
        } else {
          reportLines.push(`✖ ${file.name}: ${res.error}`);
        }
      });

      if (convertedCount === 0) {
        result.innerHTML = '<p>没有成功转换的文件，请确认 BMP 文件是否有效。</p>';
        resetProgress();
      } else {
        setProgress(0, '正在打包 ZIP...');
        setUploadProgress(100, '上传已完成，正在打包');
        const zipBlob = await zip.generateAsync({ type: 'blob' }, metadata => {
          setProgress(metadata.percent, `打包中 ${Math.round(metadata.percent)}%`);
        });
        const url = URL.createObjectURL(zipBlob);
        result.innerHTML = `
          <p>已成功转换 ${convertedCount} 个文件。</p>
          <p><a id="downloadLink" href="${url}" download="converted_tifs.zip">点击下载 ZIP 包</a></p>
        `;
        setProgress(100, '完成，准备下载。');
      }

      const log = document.createElement('pre');
      log.textContent = reportLines.join('\n');
      result.appendChild(log);

      convertBtn.disabled = false;
      fileInput.disabled = false;
    });
  </script>
