<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>BMP 转 TIFF 在线转换器</title>
  <script src="https://cdn.jsdelivr.net/npm/fflate@0.8.2/umd/index.js"></script>
  <style>
    :root { color-scheme: dark; accent-color: #38bdf8; }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Microsoft YaHei', 'Segoe UI', Arial, sans-serif;
      background: #08101a; color: #e6e8eb; min-height: 100vh;
    }
    .page {
      max-width: 760px; margin: 20px auto; padding: 24px;
      background: #112131; border-radius: 16px;
      border: 1px solid rgba(255,255,255,0.06);
    }
    h1 { font-size: 28px; color: #fff; margin-bottom: 4px; }
    .sub { font-size: 13px; color: #64748b; margin-bottom: 20px; }
    .drop-zone {
      padding: 32px 20px; border: 2px dashed rgba(56,189,248,0.5);
      border-radius: 14px; text-align: center; cursor: pointer;
      background: rgba(15,41,55,0.9); margin-bottom: 16px; transition: .2s;
    }
    .drop-zone:hover, .drop-zone.drag-over { background: rgba(56,189,248,0.1); border-color: #38bdf8; }
    .drop-icon { font-size: 40px; margin-bottom: 8px; }
    .drop-text { color: #94a3b8; font-size: 14px; }
    .drop-hint { color: #475569; font-size: 12px; margin-top: 6px; }
    .actions { display: flex; flex-wrap: wrap; gap: 14px; align-items: center; margin-bottom: 16px; }
    input[type=file] { display: none; }
    label { color: #cbd5e1; font-size: 14px; white-space: nowrap; }
    select, input[type=range] {
      background: #0f1720; color: #e6e8eb; border: 1px solid rgba(148,163,184,0.3);
      border-radius: 8px; padding: 8px 10px; font-size: 14px;
    }
    .btn {
      border: none; border-radius: 10px; padding: 11px 22px; cursor: pointer;
      font-size: 15px; font-weight: 600; transition: .2s;
    }
    .btn-primary {
      background: linear-gradient(135deg, #0ea5e9, #22d3ee); color: #0f1720;
    }
    .btn-primary:hover:not(:disabled) { box-shadow: 0 4px 20px rgba(14,165,233,0.35); }
    .btn-primary:disabled { opacity: 0.5; cursor: not-allowed; }
    .btn-clear { background: rgba(255,255,255,0.08); color: #94a3b8; }
    .btn-clear:hover { background: rgba(255,255,255,0.14); }
    .progress-wrap { margin-top: 12px; }
    .progress-bar-bg {
      width: 100%; height: 10px; background: rgba(255,255,255,0.08);
      border-radius: 5px; overflow: hidden; margin-bottom: 6px;
    }
    .progress-bar {
      height: 100%; width: 0%; border-radius: 5px;
      background: linear-gradient(90deg, #38bdf8, #22d3ee); transition: width .3s;
    }
    .progress-info { font-size: 13px; color: #94a3b8; display: flex; justify-content: space-between; }
    .file-list { margin-top: 10px; }
    .file-row {
      display: block; padding: 10px 14px;
      margin-bottom: 6px; border-radius: 10px; background: rgba(255,255,255,0.03);
      border: 1px solid rgba(148,163,184,0.1); font-size: 13px;
    }
    .file-top { display: flex; align-items: center; gap: 10px; }
    .file-row .name { flex: 1; color: #e2e8f0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .file-row .size { color: #64748b; }
    .file-row .status { min-width: 60px; text-align: right; font-size:12px; }
    .status-ok { color: #4ade80; }
    .status-err { color: #f87171; }
    .file-mini-bar {
      height: 4px; border-radius: 2px; margin-top: 6px; background: rgba(255,255,255,0.06);
      overflow: hidden; display: none;
    }
    .file-mini-bar .fill {
      height: 100%; border-radius: 2px; width: 0%; transition: width .4s;
      background: linear-gradient(90deg, #38bdf8, #22d3ee);
    }
    .file-mini-bar .fill.done { background: #4ade80; }
    .file-mini-bar .fill.error { background: #f87171; width: 100%; }
    .file-mini-bar .fill.running {
      width: 100%; animation: pulse 1.5s ease-in-out infinite;
      background: linear-gradient(90deg, #38bdf8 30%, #818cf8 50%, #38bdf8 70%);
      background-size: 200% 100%;
    }
    @keyframes pulse {
      0% { background-position: 200% 0; }
      100% { background-position: -200% 0; }
    }
    .result { margin-top: 16px; }
    .result a { color: #7dd3fc; text-decoration: none; }
    .result a:hover { text-decoration: underline; }
    .log { margin-top: 14px; padding: 14px; background: rgba(0,0,0,0.3); border-radius: 10px;
      font-family: 'Consolas', 'Courier New', monospace; font-size: 12px;
      color: #94a3b8; max-height: 200px; overflow-y: auto; white-space: pre-wrap; }
    .field-row { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
  </style>
</head>
<body>
  <div class="page">
    <h1>BMP → TIFF 批量转换</h1>
    <div class="sub">纯前端处理，文件不会上传到服务器，极速转换</div>

    <div id="dropZone" class="drop-zone">
      <div class="drop-icon">📁</div>
      <div class="drop-text">点击此处或拖拽 BMP 文件/文件夹</div>
      <div class="drop-hint">自动筛选 .bmp 文件</div>
    </div>
    <input id="fileInput" type="file" accept=".bmp,image/bmp" multiple />
    <input id="folderInput" type="file" webkitdirectory />

    <div class="actions">
      <button class="btn btn-clear" id="btnFiles">选择文件</button>
      <button class="btn btn-clear" id="btnFolder">选择文件夹</button>
    </div>

    <div class="field-row" style="margin-bottom:12px;gap:16px;">
      <label>压缩:</label>
      <select id="compression">
        <option value="deflate" selected>ZIP/Deflate (快)</option>
        <option value="lzw">LZW</option>
        <option value="none">无压缩</option>
        <option value="jpeg">JPEG</option>
      </select>
      <label>像素排列:</label>
      <select id="pixelOrder">
        <option value="interleaved" selected>RGBRGB</option>
        <option value="perchannel">RRGGBB</option>
      </select>
      <label title="线程数">线程:</label>
      <input id="threads" type="range" min="1" max="8" value="4" style="width:80px">
      <span id="threadsVal" style="color:#38bdf8;font-size:13px;">4</span>
    </div>

    <button class="btn btn-primary" id="btnConvert" disabled>🔄 开始转换</button>

    <div id="progressWrap" class="progress-wrap" style="display:none">
      <div class="progress-bar-bg"><div id="progressBar" class="progress-bar"></div></div>
      <div class="progress-info"><span id="progressText"></span><span id="progressPct">0%</span></div>
    </div>

    <div id="fileList" class="file-list"></div>
    <div id="result" class="result"></div>

    <div style="margin-top:20px;font-size:12px;color:#475569">
      所有处理在浏览器完成，文件不会离开你的设备。支持 BMP → TIFF，批量 ZIP 下载。
    </div>
  </div>

  <script>
    // ═══════════ DOM refs ═══════════
    const $ = id => document.getElementById(id);
    const dropZone = $('dropZone');
    const fileInput = $('fileInput');
    const folderInput = $('folderInput');
    const btnConvert = $('btnConvert');
    const progressWrap = $('progressWrap');
    const progressBar = $('progressBar');
    const progressText = $('progressText');
    const progressPct = $('progressPct');
    const fileListEl = $('fileList');
    const resultEl = $('result');
    const compressionSel = $('compression');
    const pixelOrderSel = $('pixelOrder');
    const threadsSlider = $('threads');
    const threadsVal = $('threadsVal');

    let files = [];

    // ═══════════ Threads ═══════════
    const hw = navigator.hardwareConcurrency || 4;
    threadsSlider.max = Math.min(hw, 8);
    threadsSlider.value = Math.min(hw, 4);
    threadsVal.textContent = threadsSlider.value;
    threadsSlider.oninput = () => threadsVal.textContent = threadsSlider.value;

    // ═══════════ File handling ═══════════
    $('btnFiles').onclick = () => fileInput.click();
    $('btnFolder').onclick = () => folderInput.click();

    dropZone.onclick = () => fileInput.click();
    dropZone.ondragover = e => { e.preventDefault(); dropZone.classList.add('drag-over'); };
    dropZone.ondragleave = () => dropZone.classList.remove('drag-over');
    dropZone.ondrop = e => {
      e.preventDefault(); dropZone.classList.remove('drag-over');
      handleDropped(e.dataTransfer);
    };
    fileInput.onchange = () => addFiles(Array.from(fileInput.files));
    folderInput.onchange = () => addFiles(Array.from(folderInput.files));

    async function handleDropped(dt) {
      const items = Array.from(dt.items || []);
      const entries = items.map(i => i.webkitGetAsEntry ? i.webkitGetAsEntry() : null).filter(Boolean);
      if (!entries.length) { addFiles(Array.from(dt.files || [])); return; }

      const all = [];
      async function walk(entry) {
        if (entry.isFile) { const f = await new Promise(r => entry.file(r)); all.push(f); }
        else if (entry.isDirectory) {
          const reader = entry.createReader();
          const subs = await new Promise(r => reader.readEntries(r));
          await Promise.all(subs.map(walk));
        }
      }
      await Promise.all(entries.map(walk));
      addFiles(all);
    }

    function addFiles(arr) {
      const bmps = arr.filter(f => f.name.toLowerCase().endsWith('.bmp'));
      if (!bmps.length) return;
      // dedup
      const seen = new Set(files.map(f => f.name + f.size));
      for (const f of bmps) if (!seen.has(f.name + f.size)) { files.push(f); seen.add(f.name + f.size); }
      renderList();
    }

    function renderList() {
      if (!files.length) {
        fileListEl.innerHTML = '';
        btnConvert.disabled = true;
        return;
      }
      btnConvert.disabled = false;
      const totalSize = files.reduce((s, f) => s + f.size, 0);
      fileListEl.innerHTML = files.map((f, i) =>
        `<div class="file-row" id="filerow-${i}">
          <div class="file-top">
            <span class="name">📄 ${f.name}</span>
            <span class="size">${fmtSize(f.size)}</span>
            <span class="status" id="filestatus-${i}"></span>
            <span style="color:#f87171;cursor:pointer;padding:0 8px;" onclick="removeFile(${i})">✕</span>
          </div>
          <div class="file-mini-bar" id="filebar-${i}"><div class="fill" id="filefill-${i}"></div></div>
        </div>`
      ).join('');
      fileListEl.innerHTML += `<div style="font-size:12px;color:#64748b;margin-top:6px">${files.length} 个文件, ${fmtSize(totalSize)}</div>`;
    }

    function removeFile(i) { files.splice(i, 1); renderList(); }
    function fmtSize(b) { return b < 1024 ? b + ' B' : b < 1048576 ? (b / 1024).toFixed(1) + ' KB' : (b / 1048576).toFixed(1) + ' MB'; }

    // ═══════════ Fast TIF Builder ═══════════
    // Builds a valid TIFF from raw RGBA pixel data, directly (no UTIF overhead)

    function tifPutLE(buf, off, val, bytes) {
      for (let i = 0; i < bytes; i++) { buf[off + i] = (val >> (i * 8)) & 0xFF; }
    }

    function buildTIF(width, height, rgba, opts, onProgress) {
      const { comp, pixelOrder } = opts;
      const totalPx = width * height;
      const report = (pct) => { if (onProgress) onProgress(pct); };

      // Rearrange pixel data if needed
      let raw;
      if (pixelOrder === 'perchannel') {
        report(5);
        raw = new Uint8Array(totalPx * 4);
        let lastReport = 0;
        for (let i = 0; i < totalPx; i++) {
          raw[i] = rgba[i * 4];
          raw[totalPx + i] = rgba[i * 4 + 1];
          raw[totalPx * 2 + i] = rgba[i * 4 + 2];
          raw[totalPx * 3 + i] = rgba[i * 4 + 3];
          const pct = 5 + Math.round(i / totalPx * 25);
          if (pct > lastReport) { lastReport = pct; report(pct); }
        }
      } else {
        raw = rgba;
        report(30);
      }

      // Compress
      let imageData, compTag;
      if (comp === 'deflate') {
        report(35);
        imageData = pako_deflate(raw);
        report(90);
        compTag = 8;
      } else if (comp === 'lzw') {
        report(35);
        imageData = lzwEncode(raw, (pct) => report(35 + Math.round(pct * 0.55)));
        compTag = 5;
      } else if (comp === 'jpeg') {
        imageData = raw;
        compTag = 7;
      } else {
        imageData = raw;
        report(95);
        compTag = 1;
      }

      // TIFF header
      const dataOff = 8 + 2 + 12 * 12 + 4; // header + count + 12 tags * 12 + nextIfd
      const overflowSize = 8 + 8 + 8; // BPS(4×SHORT) + XRes(RATIONAL) + YRes(RATIONAL)
      const buf = new Uint8Array(dataOff + imageData.byteLength + overflowSize);
      // Byte order: "II"
      buf[0] = 0x49; buf[1] = 0x49;
      // Magic: 42
      tifPutLE(buf, 2, 42, 2);
      // IFD offset
      tifPutLE(buf, 4, 8, 4);

      let pos = 8;
      // Entry count (12 tags)
      tifPutLE(buf, pos, 12, 2); pos += 2;

      const tags = [
        [256, 4, 1, width],      // ImageWidth (LONG)
        [257, 4, 1, height],     // ImageLength
        [258, 3, 4, 0],          // BitsPerSample (SHORT*4) → write to overflow
        [259, 3, 1, compTag],    // Compression
        [262, 3, 1, 2],          // PhotometricInterpretation (RGB=2)
        [273, 4, 1, dataOff],    // StripOffsets
        [277, 3, 1, 4],          // SamplesPerPixel
        [278, 4, 1, height],     // RowsPerStrip
        [279, 4, 1, imageData.byteLength], // StripByteCounts
        [282, 5, 1, 0],          // XResolution → overflow
        [283, 5, 1, 0],          // YResolution → overflow
        [284, 3, 1, pixelOrder === 'perchannel' ? 2 : 1], // PlanarConfiguration
      ];

      // We need overflow for BitsPerSample (4 SHORTs), XResolution, YResolution
      let overflow = dataOff + imageData.byteLength;
      const overflowData = [];
      // BitsPerSample: 4 SHORTs = 8 bytes
      const bpsOff = overflow;
      for (const v of [8, 8, 8, 8]) {
        overflowData.push(v & 0xFF, (v >> 8) & 0xFF);
        overflow += 2;
      }
      // XResolution: RATIONAL (2 LONGs) = 8 bytes
      const xrOff = overflow;
      overflowData.push(72, 0, 0, 0);  // numerator
      overflowData.push(1, 0, 0, 0);   // denominator
      overflow += 8;
      // YResolution: RATIONAL = 8 bytes
      const yrOff = overflow;
      overflowData.push(72, 0, 0, 0);
      overflowData.push(1, 0, 0, 0);
      overflow += 8;

      // Patch overflow offsets into tags
      tags[2][3] = bpsOff;
      tags[9][3] = xrOff;
      tags[10][3] = yrOff;

      // Write tags
      for (const [tag, type, count, value] of tags) {
        tifPutLE(buf, pos, tag, 2);
        tifPutLE(buf, pos + 2, type, 2);
        tifPutLE(buf, pos + 4, count, 4);
        if (type === 3 && count === 1 && value < 0x10000) {
          // SHORT fits inline
          tifPutLE(buf, pos + 8, value, 2);
          tifPutLE(buf, pos + 10, 0, 2);
        } else if (type === 4 && count === 1) {
          tifPutLE(buf, pos + 8, value, 4);
        } else {
          tifPutLE(buf, pos + 8, value, 4); // overflow offset
        }
        pos += 12;
      }

      // Next IFD = 0
      tifPutLE(buf, pos, 0, 4);

      // Image data
      buf.set(imageData instanceof Uint8Array ? imageData : new Uint8Array(imageData), dataOff);
      // Overflow data
      if (overflowData.length) {
        buf.set(new Uint8Array(overflowData), dataOff + imageData.byteLength);
      }

      return buf.buffer;
    }

    // ═══════════ Pako (Deflate) - inline minimal bundling ═══════════
    // We embed a tiny deflate via raw DeflateStream. pako is loaded via script tag above.
    // But for workers we need it too. We'll pass data back to main thread for compression.
    // Actually, we'll do compression in main thread after getting raw pixels from workers.

    // ═══════════ LZW - optimized numeric version with progress ═══════════
    function lzwEncode(data, onProgress) {
      const codeMap = new Map();
      let nextCode = 258;
      const CLEAR = 256, EOI = 257;
      const dataLen = data.length;

      let prefix = data[0];
      const codes = [CLEAR];
      let lastReport = 0;

      for (let i = 1; i < dataLen; i++) {
        const k = data[i];
        const key = prefix * 256 + k;
        if (codeMap.has(key)) {
          prefix = codeMap.get(key);
        } else {
          codes.push(prefix);
          if (nextCode < 4096) {
            codeMap.set(key, nextCode++);
          } else {
            codes.push(CLEAR);
            codeMap.clear();
            nextCode = 258;
            codeMap.set(key, nextCode++);
          }
          prefix = k;
        }
        // Report progress every ~1%
        if (onProgress) {
          const pct = Math.round(i / dataLen * 100);
          if (pct > lastReport) { lastReport = pct; onProgress(pct / 100); }
        }
      }
      codes.push(prefix);
      codes.push(EOI);

      // Bit packing - TIFF LZW
      if (onProgress) onProgress(0.95);
      const out = [];
      let buf = 0, bits = 0;
      const out = [];
      let buf = 0, bits = 0;
      for (const code of codes) {
        buf |= code << bits;
        bits += 12;
        while (bits >= 8) {
          out.push(buf & 0xFF);
          buf >>= 8;
          bits -= 8;
        }
      }
      if (bits > 0) out.push(buf & 0xFF);
      return new Uint8Array(out);
    }

    // ═══════════ Worker ═══════════
    // Worker only decodes BMP→RGBA, main thread handles TIF building (lighter worker)
    const workerCode = `
      self.onmessage = async function(e) {
        const { file, idx } = e.data;
        try {
          const bitmap = await createImageBitmap(file);
          const w = bitmap.width, h = bitmap.height;
          const c = new OffscreenCanvas(w, h);
          const ctx = c.getContext('2d');
          ctx.drawImage(bitmap, 0, 0);
          const imgData = ctx.getImageData(0, 0, w, h);
          // Transfer the RGBA buffer
          self.postMessage({ idx, w, h, rgba: imgData.data.buffer }, [imgData.data.buffer]);
        } catch(err) {
          self.postMessage({ idx, error: err.message });
        }
      };
    `;
    const workerBlob = new Blob([workerCode], { type: 'application/javascript' });
    const workerUrl = URL.createObjectURL(workerBlob);

    function spawnWorker() { return new Worker(workerUrl); }

    // ═══════════ Conversion ═══════════
    btnConvert.onclick = async () => {
      if (!files.length) return;
      btnConvert.disabled = true;
      resultEl.innerHTML = '';
      progressWrap.style.display = 'block';
      progressBar.style.width = '0%';
      progressPct.textContent = '0%';
      progressText.textContent = '准备中...';

      const comp = compressionSel.value;
      const pixelOrder = pixelOrderSel.value;
      const threadCount = Math.min(+threadsSlider.value, files.length);
      const total = files.length;

      // Track per-file progress
      const results = new Array(total).fill(null);

      function setFileProgress(i, pct, label) {
        const st = document.getElementById('filestatus-' + i);
        const bar = document.getElementById('filebar-' + i);
        const fill = document.getElementById('filefill-' + i);
        if (st && label) { st.textContent = label; st.className = 'status'; }
        if (bar && fill) {
          bar.style.display = 'block';
          fill.className = 'fill';
          fill.style.width = Math.round(pct) + '%';
        }
      }

      function updateStatus(i, text, cls) {
        const st = document.getElementById('filestatus-' + i);
        const bar = document.getElementById('filebar-' + i);
        const fill = document.getElementById('filefill-' + i);
        if (st) { st.textContent = text; st.className = 'status ' + (cls || ''); }
        if (bar && fill) {
          bar.style.display = 'block';
          if (cls === 'status-ok') {
            fill.className = 'fill done';
            fill.style.width = '100%';
          } else if (cls === 'status-err') {
            fill.className = 'fill error';
          } else {
            fill.style.width = '0%';
          }
        }
      }

      let completed = 0;

      // Parallel processing: run workers in batches
      function processBatch() {
        return new Promise(resolve => {
          let nextIdx = 0;
          let active = 0;

          function startOne() {
            if (nextIdx >= total) return;
            const i = nextIdx++;
            active++;
            setFileProgress(i, 0, '解码 0%');

            // Simulate decode progress based on file size (larger = slower tick)
            const fileSize = files[i].size;
            const tickMs = Math.max(30, Math.min(200, fileSize / 50000));
            let decodePct = 0;
            const decodeTimer = setInterval(() => {
              decodePct += 2;
              if (decodePct >= 85) decodePct = 85;
              setFileProgress(i, decodePct, `解码 ${decodePct}%`);
            }, tickMs);

            const worker = spawnWorker();
            const timeout = setTimeout(() => {
              clearInterval(decodeTimer);
              worker.terminate();
              updateStatus(i, '超时', 'status-err');
              results[i] = { error: '解码超时' };
              onDone(i);
            }, 120000);

            worker.onmessage = (e) => {
              clearTimeout(timeout);
              clearInterval(decodeTimer);
              worker.terminate();
              const d = e.data;
              if (d.error) {
                updateStatus(i, '失败', 'status-err');
                results[i] = { error: d.error };
                onDone(i);
                return;
              }
              setFileProgress(i, 50, '编码 50%');
              // Build TIF asynchronously with real progress
              setTimeout(() => {
                try {
                  const rgba = new Uint8Array(d.rgba);
                  let tifBuf;
                  if (comp === 'jpeg') {
                    results[i] = { jpeg: true, w: d.w, h: d.h, rgba, file: files[i] };
                    setFileProgress(i, 50, 'JPEG压缩...');
                  } else {
                    tifBuf = buildTIF(d.w, d.h, rgba, { comp, pixelOrder },
                      (pct) => { setFileProgress(i, 50 + pct * 0.5, `编码 ${Math.round(50 + pct * 50)}%`); });
                    results[i] = { buffer: tifBuf, name: files[i].name.replace(/\.bmp$/i, '.tif') };
                  }
                  updateStatus(i, '✓', 'status-ok');
                } catch (err) {
                  updateStatus(i, '编码失败', 'status-err');
                  results[i] = { error: err.message };
                }
                onDone(i);
              }, 0);
            };
            worker.onerror = () => {
              clearTimeout(timeout);
              worker.terminate();
              updateStatus(i, '错误', 'status-err');
              results[i] = { error: 'Worker error' };
              onDone(i);
            };
            worker.postMessage({ file: files[i], idx: i });
          }

          function onDone(i) {
            completed++;
            const pct = Math.round(completed / total * 100);
            progressBar.style.width = pct + '%';
            progressPct.textContent = pct + '%';
            progressText.textContent = `完成 ${completed}/${total}`;
            active--;
            startOne();
            if (completed >= total) resolve();
          }

          // Start initial batch
          for (let j = 0; j < threadCount; j++) startOne();
        });
      }

      await processBatch();

      // Handle JPEG conversions (need canvas in main thread)
      for (let i = 0; i < total; i++) {
        if (results[i]?.jpeg) {
          const { w, h, rgba, file } = results[i];
          try {
            const canvas = document.createElement('canvas');
            canvas.width = w; canvas.height = h;
            const ctx = canvas.getContext('2d');
            const imgData = ctx.createImageData(w, h);
            imgData.data.set(rgba);
            ctx.putImageData(imgData, 0, 0);
            const jpegBlob = await new Promise(r => canvas.toBlob(r, 'image/jpeg', 0.9));
            const jpegBuf = await jpegBlob.arrayBuffer();
            // Build TIF with JPEG data
            const tifBuf = buildTIF_JPEG(w, h, rgba, { pixelOrder }, new Uint8Array(jpegBuf));
            results[i] = { buffer: tifBuf, name: file.name.replace(/\.bmp$/i, '.tif') };
            updateStatus(i, '✓', 'status-ok');
          } catch (e) {
            results[i] = { error: e.message };
            updateStatus(i, 'JPEG失败', 'status-err');
          }
        }
      }

      // ═══════════ ZIP & Download ═══════════
      progressText.textContent = '打包 ZIP...';
      let successCount = 0;
      const logLines = [];

      // Try File System Access API
      let wStream = null;
      if (typeof window.showSaveFilePicker === 'function') {
        try {
          const h = await window.showSaveFilePicker({
            suggestedName: 'converted_tifs.zip',
            types: [{ description: 'ZIP', accept: { 'application/zip': ['.zip'] } }]
          });
          wStream = await h.createWritable();
        } catch (e) {
          if (e.name === 'AbortError') { btnConvert.disabled = false; return; }
        }
      }

      const chunks = [];
      let zipDone;
      const zipDonePromise = new Promise(r => zipDone = r);
      const zip = new fflate.Zip();
      zip.ondata = (err, data, final) => {
        if (err) throw err;
        if (wStream) wStream.write(data);
        else chunks.push(data);
        if (final) {
          (wStream ? wStream.close() : Promise.resolve()).then(zipDone);
        }
      };

      for (let i = 0; i < total; i++) {
        const r = results[i];
        if (r?.buffer) {
          const entry = new fflate.ZipDeflate(r.name, { level: 6 });
          zip.add(entry);
          entry.push(new Uint8Array(r.buffer), true);
          successCount++;
          logLines.push(`✔ ${r.name}`);
          r.buffer = null; // free memory
        } else {
          logLines.push(`✖ ${files[i].name}: ${r?.error || '未知错误'}`);
        }
      }

      if (successCount > 0) {
        zip.end();
        await zipDonePromise;
      }

      // Show result
      progressBar.style.width = '100%';
      progressPct.textContent = '100%';
      progressText.textContent = `完成: ${successCount} 成功, ${total - successCount} 失败`;

      if (wStream) {
        resultEl.innerHTML = `<p style="color:#4ade80">✓ 已保存 ${successCount} 个文件到本地</p>`;
      } else if (successCount > 0) {
        const blob = new Blob(chunks, { type: 'application/zip' });
        const url = URL.createObjectURL(blob);
        resultEl.innerHTML = `
          <p style="color:#4ade80">✓ 转换完成: ${successCount}/${total}</p>
          <p><a href="${url}" download="converted_tifs.zip" style="font-size:16px">⬇ 下载 ZIP (${fmtSize(blob.size)})</a></p>
        `;
      } else {
        resultEl.innerHTML = '<p style="color:#f87171">转换失败，请检查 BMP 文件是否有效</p>';
      }

      resultEl.innerHTML += `<div class="log">${logLines.join('\n')}</div>`;
      btnConvert.disabled = false;
    };

    // JPEG TIF builder (separate because JPEG in TIF uses different tags)
    function buildTIF_JPEG(width, height, rgba, opts, jpegData) {
      const { pixelOrder } = opts;
      // For JPEG in TIFF, we still use raw pixel data arrangement
      // Actually JPEG-in-TIFF is tricky. Let's just store the JPEG data as-is.
      // TIFF with JPEG compression (tag 7) uses the JPEG interchange format

      const dataOff = 8 + 2 + 13 * 12 + 4;
      const buf = new Uint8Array(dataOff + jpegData.length + 24); // overflow: BPS(3×SHORT=6) + XRes(8) + YRes(8)

      buf[0] = 0x49; buf[1] = 0x49;
      tifPutLE(buf, 2, 42, 2);
      tifPutLE(buf, 4, 8, 4);

      let pos = 8;
      tifPutLE(buf, pos, 13, 2); pos += 2;

      const tags = [
        [256, 4, 1, width],
        [257, 4, 1, height],
        [258, 3, 4, 0],           // BitsPerSample overflow
        [259, 3, 1, 7],           // JPEG compression
        [262, 3, 1, 6],           // YCbCr
        [273, 4, 1, dataOff],     // StripOffsets
        [277, 3, 1, 3],           // SamplesPerPixel = 3 (JPEG)
        [278, 4, 1, height],
        [279, 4, 1, jpegData.length],
        [282, 5, 1, 0],           // XResolution overflow
        [283, 5, 1, 0],           // YResolution overflow
        [284, 3, 1, pixelOrder === 'perchannel' ? 2 : 1],
        [296, 3, 1, 2],           // ResolutionUnit = inch
      ];

      let overflow = dataOff + jpegData.length;
      const overflowData = [];
      const bpsOff = overflow;
      for (const v of [8, 8, 8]) {
        overflowData.push(v & 0xFF, (v >> 8) & 0xFF);
        overflow += 2;
      }
      const xrOff = overflow;
      overflowData.push(72, 0, 0, 0, 1, 0, 0, 0);
      overflow += 8;
      const yrOff = overflow;
      overflowData.push(72, 0, 0, 0, 1, 0, 0, 0);
      overflow += 8;

      tags[2][3] = bpsOff;
      tags[9][3] = xrOff;
      tags[10][3] = yrOff;

      for (const [tag, type, count, value] of tags) {
        tifPutLE(buf, pos, tag, 2);
        tifPutLE(buf, pos + 2, type, 2);
        tifPutLE(buf, pos + 4, count, 4);
        if (type === 3 && count === 1 && value < 0x10000) {
          tifPutLE(buf, pos + 8, value, 2);
          tifPutLE(buf, pos + 10, 0, 2);
        } else if (type === 4 && count === 1) {
          tifPutLE(buf, pos + 8, value, 4);
        } else {
          tifPutLE(buf, pos + 8, value, 4);
        }
        pos += 12;
      }
      tifPutLE(buf, pos, 0, 4);

      buf.set(jpegData, dataOff);
      if (overflowData.length) buf.set(new Uint8Array(overflowData), dataOff + jpegData.length);

      return buf.buffer;
    }

    // Pako reference - loaded from CDN but accessed via global
    // We need it for Deflate. It's loaded as script tag at top.
    // Access via global pako
    function pako_deflate(data) {
      if (typeof pako !== 'undefined') return pako.deflate(data);
      // Fallback: no compression
      return data;
    }
  </script>
  <script src="https://cdn.jsdelivr.net/npm/pako@2.1.0/dist/pako.min.js"></script>
