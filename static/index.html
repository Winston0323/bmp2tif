<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BMP 转 TIF 批量转换工具</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Microsoft YaHei', 'Segoe UI', sans-serif;
            background: #0f0f0f;
            color: #e0e0e0;
            min-height: 100vh;
        }
        .container {
            max-width: 800px;
            margin: 0 auto;
            padding: 30px 20px;
        }
        h1 {
            text-align: center;
            font-size: 28px;
            margin-bottom: 30px;
            background: linear-gradient(135deg, #60a5fa, #a78bfa);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .card {
            background: #1a1a2e;
            border: 1px solid #2a2a4a;
            border-radius: 12px;
            padding: 24px;
            margin-bottom: 20px;
        }
        .card-title {
            font-size: 14px;
            color: #888;
            margin-bottom: 16px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        /* 拖拽上传区 */
        .drop-zone {
            border: 2px dashed #3a3a5a;
            border-radius: 10px;
            padding: 40px 20px;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s;
            background: #12122a;
        }
        .drop-zone:hover, .drop-zone.dragover {
            border-color: #60a5fa;
            background: #1a1a3e;
        }
        .drop-zone-icon { font-size: 48px; margin-bottom: 10px; }
        .drop-zone-text { color: #888; font-size: 14px; }
        .drop-zone-text strong { color: #60a5fa; }
        .upload-hint { color: #555; font-size: 12px; margin-top: 8px; }
        .hidden-input { display: none; }
        .mode-btns {
            display: flex;
            gap: 10px;
            justify-content: center;
            margin-top: 14px;
        }
        .mode-btn {
            padding: 8px 20px;
            border: 1px solid #3a3a5a;
            border-radius: 8px;
            background: #12122a;
            color: #aaa;
            cursor: pointer;
            font-size: 13px;
            transition: all 0.2s;
        }
        .mode-btn:hover { border-color: #60a5fa; color: #60a5fa; }
        .mode-btn.active { border-color: #60a5fa; color: #60a5fa; background: #1a1a3e; }

        /* 文件列表 */
        .file-list {
            margin-top: 16px;
            max-height: 180px;
            overflow-y: auto;
        }
        .file-list::-webkit-scrollbar { width: 6px; }
        .file-list::-webkit-scrollbar-thumb { background: #3a3a5a; border-radius: 3px; }
        .file-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 8px 12px;
            background: #12122a;
            border-radius: 6px;
            margin-bottom: 4px;
            font-size: 13px;
        }
        .file-item .name { color: #c0c0c0; }
        .file-item .size { color: #666; font-size: 12px; }
        .file-item .remove {
            color: #f14c4c;
            cursor: pointer;
            padding: 0 6px;
            font-size: 16px;
        }
        .file-count {
            margin-top: 10px;
            font-size: 13px;
            color: #888;
        }
        .file-count strong { color: #60a5fa; }

        /* 选项 */
        .option-group { margin-bottom: 16px; }
        .option-label {
            font-size: 14px;
            color: #aaa;
            margin-bottom: 8px;
            display: block;
        }
        .radio-group { display: flex; gap: 12px; flex-wrap: wrap; }
        .radio-item {
            position: relative;
            cursor: pointer;
        }
        .radio-item input { position: absolute; opacity: 0; }
        .radio-item span {
            display: inline-block;
            padding: 8px 18px;
            border: 1px solid #3a3a5a;
            border-radius: 8px;
            font-size: 13px;
            color: #888;
            transition: all 0.2s;
            background: #12122a;
        }
        .radio-item input:checked + span {
            border-color: #60a5fa;
            color: #60a5fa;
            background: #1a1a3e;
        }
        .radio-item:hover span { border-color: #555; }

        .checkbox-item {
            display: flex;
            align-items: center;
            gap: 10px;
            cursor: pointer;
            margin-top: 12px;
        }
        .checkbox-item input[type="checkbox"] {
            width: 18px; height: 18px;
            accent-color: #60a5fa;
        }
        .checkbox-item .label { font-size: 14px; color: #c0c0c0; }
        .checkbox-item .hint { font-size: 12px; color: #666; }

        /* 设置 */
        .settings-toggle {
            font-size: 13px;
            color: #666;
            cursor: pointer;
            margin-top: 12px;
            user-select: none;
        }
        .settings-toggle:hover { color: #888; }
        .settings-body { display: none; margin-top: 10px; }
        .settings-body.open { display: block; }
        .workers-input {
            background: #12122a;
            border: 1px solid #3a3a5a;
            color: #e0e0e0;
            padding: 6px 12px;
            border-radius: 6px;
            width: 80px;
            font-size: 13px;
        }
        .workers-hint { font-size: 12px; color: #555; margin-left: 8px; }

        /* 按钮 */
        .btn-convert {
            width: 100%;
            padding: 14px;
            font-size: 16px;
            font-weight: bold;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            background: linear-gradient(135deg, #3b82f6, #8b5cf6);
            color: #fff;
            transition: all 0.3s;
            letter-spacing: 2px;
        }
        .btn-convert:hover { transform: translateY(-1px); box-shadow: 0 4px 20px rgba(59,130,246,0.4); }
        .btn-convert:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
            box-shadow: none;
        }

        /* 进度 */
        .progress-section { display: none; }
        .progress-section.active { display: block; }
        .phase-label {
            font-size: 15px;
            font-weight: bold;
            color: #60a5fa;
            margin-bottom: 8px;
        }
        .phase-label .sub { font-weight: normal; font-size: 12px; color: #666; margin-left: 8px; }
        .progress-bar-bg {
            height: 10px;
            background: #2a2a4a;
            border-radius: 5px;
            overflow: hidden;
            margin: 8px 0;
        }
        .progress-bar-fill {
            height: 100%;
            background: linear-gradient(90deg, #3b82f6, #8b5cf6);
            border-radius: 5px;
            transition: width 0.3s;
            width: 0%;
        }
        .progress-bar-fill.green {
            background: linear-gradient(90deg, #10b981, #059669);
        }
        .progress-bar-fill.orange {
            background: linear-gradient(90deg, #f59e0b, #d97706);
        }
        .progress-info {
            display: flex;
            justify-content: space-between;
            font-size: 13px;
            color: #888;
        }
        .phase-steps {
            display: flex;
            gap: 4px;
            margin-bottom: 16px;
        }
        .phase-step {
            flex: 1;
            text-align: center;
            padding: 6px 4px;
            font-size: 10px;
            color: #555;
            background: #12122a;
            border-radius: 4px;
            transition: all 0.3s;
        }
        .phase-step.active {
            color: #60a5fa;
            background: #1a1a3e;
            border: 1px solid #3a5aaa;
        }
        .phase-step.done {
            color: #4ec9b0;
            background: #0f2a22;
            border: 1px solid #2a5a4a;
        }

        /* 结果 */
        .result-section { display: none; }
        .result-section.active { display: block; }
        .result-stats {
            display: flex;
            gap: 20px;
            margin-bottom: 16px;
        }
        .stat {
            flex: 1;
            text-align: center;
            padding: 12px;
            background: #12122a;
            border-radius: 8px;
        }
        .stat-value { font-size: 24px; font-weight: bold; }
        .stat-value.success { color: #4ec9b0; }
        .stat-value.fail { color: #f14c4c; }
        .stat-label { font-size: 12px; color: #666; margin-top: 4px; }

        .btn-download {
            display: inline-block;
            padding: 10px 24px;
            background: linear-gradient(135deg, #10b981, #059669);
            color: #fff;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 14px;
            text-decoration: none;
            transition: all 0.3s;
        }
        .btn-download:hover { transform: translateY(-1px); box-shadow: 0 4px 16px rgba(16,185,129,0.4); }

        .result-files {
            margin-top: 16px;
            max-height: 200px;
            overflow-y: auto;
        }
        .result-file {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 8px 12px;
            background: #12122a;
            border-radius: 6px;
            margin-bottom: 4px;
            font-size: 13px;
        }
        .result-file .name { color: #c0c0c0; }
        .result-file .status-ok { color: #4ec9b0; }
        .result-file .status-err { color: #f14c4c; }
        .result-file a {
            color: #60a5fa;
            text-decoration: none;
            font-size: 12px;
        }
        .result-file a:hover { text-decoration: underline; }

        footer {
            text-align: center;
            padding: 20px;
            color: #444;
            font-size: 12px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>BMP 转 TIF 批量转换工具</h1>

        <!-- 上传区 -->
        <div class="card">
            <div class="card-title">上传文件</div>
            <div class="drop-zone" id="drop-zone">
                <div class="drop-zone-icon">📁</div>
                <div class="drop-zone-text">拖拽 BMP 文件或文件夹到此处</div>
                <div class="upload-hint">自动筛选 .bmp 文件</div>
            </div>
            <div class="mode-btns">
                <button class="mode-btn active" id="btn-mode-files" onclick="setMode('files')">📄 选择文件</button>
                <button class="mode-btn" id="btn-mode-folder" onclick="setMode('folder')">📂 选择文件夹</button>
            </div>
            <input type="file" id="file-input" class="hidden-input" multiple accept=".bmp,.BMP">
            <input type="file" id="folder-input" class="hidden-input" webkitdirectory>
            <div class="file-list" id="file-list"></div>
            <div class="file-count" id="file-count" style="display:none"></div>
        </div>

        <!-- 选项 -->
        <div class="card">
            <div class="card-title">输出选项</div>

            <div class="option-group">
                <span class="option-label">压缩方式</span>
                <div class="radio-group">
                    <label class="radio-item"><input type="radio" name="compression" value="lzw" checked><span>LZW</span></label>
                    <label class="radio-item"><input type="radio" name="compression" value="zip"><span>ZIP</span></label>
                    <label class="radio-item"><input type="radio" name="compression" value="jpeg"><span>JPEG</span></label>
                    <label class="radio-item"><input type="radio" name="compression" value="none"><span>无压缩</span></label>
                </div>
            </div>

            <div class="option-group">
                <span class="option-label">像素排列 (Planar Configuration)</span>
                <div class="radio-group">
                    <label class="radio-item"><input type="radio" name="pixel_layout" value="interleaved" checked><span>Interleaved RGBRGB</span></label>
                    <label class="radio-item"><input type="radio" name="pixel_layout" value="perchannel"><span>Per-Channel RRGGBB</span></label>
                </div>
            </div>

            <label class="checkbox-item">
                <input type="checkbox" id="pyramid">
                <div>
                    <div class="label">保存图像金字塔 (Image Pyramid)</div>
                    <div class="hint">在文件内嵌入多级分辨率缩略图，适用于 GIS/医学影像/快速预览</div>
                </div>
            </label>

            <div class="settings-toggle" id="settings-toggle">▶ 高级设置</div>
            <div class="settings-body" id="settings-body">
                <span class="option-label">并行线程数</span>
                <input type="number" class="workers-input" id="workers" value="4" min="1" max="64">
                <span class="workers-hint" id="cpu-hint"></span>
            </div>
        </div>

        <!-- 转换按钮 -->
        <button class="btn-convert" id="btn-convert" disabled>开始转换</button>

        <!-- 进度 -->
        <div class="card progress-section" id="progress-section">
            <div class="card-title">处理进度</div>
            <div class="phase-steps">
                <div class="phase-step" id="phase-upload">1.上传</div>
                <div class="phase-step" id="phase-reading">2.读取</div>
                <div class="phase-step" id="phase-convert">3.转换</div>
                <div class="phase-step" id="phase-pack">4.打包</div>
                <div class="phase-step" id="phase-download">5.下载</div>
            </div>
            <div class="phase-label" id="phase-label">准备中...</div>
            <div class="progress-bar-bg">
                <div class="progress-bar-fill" id="progress-fill"></div>
            </div>
            <div class="progress-info">
                <span id="progress-text">0 / 0</span>
                <span id="progress-percent">0%</span>
            </div>
        </div>

        <!-- 结果 -->
        <div class="card result-section" id="result-section">
            <div class="card-title">转换结果</div>
            <div class="result-stats">
                <div class="stat">
                    <div class="stat-value success" id="stat-success">0</div>
                    <div class="stat-label">成功</div>
                </div>
                <div class="stat">
                    <div class="stat-value fail" id="stat-fail">0</div>
                    <div class="stat-label">失败</div>
                </div>
            </div>
            <a class="btn-download" id="btn-download" href="#">⬇ 下载全部 (ZIP)</a>
            <div class="result-files" id="result-files"></div>
        </div>

        <footer>BMP 转 TIF 批量转换工具 v1.0.0</footer>
    </div>

    <script>
        const dropZone = document.getElementById('drop-zone');
        const fileInput = document.getElementById('file-input');
        const folderInput = document.getElementById('folder-input');
        const fileList = document.getElementById('file-list');
        const fileCount = document.getElementById('file-count');
        const btnConvert = document.getElementById('btn-convert');
        const progressSection = document.getElementById('progress-section');
        const progressFill = document.getElementById('progress-fill');
        const progressText = document.getElementById('progress-text');
        const progressPercent = document.getElementById('progress-percent');
        const resultSection = document.getElementById('result-section');
        const statSuccess = document.getElementById('stat-success');
        const statFail = document.getElementById('stat-fail');
        const btnDownload = document.getElementById('btn-download');
        const resultFiles = document.getElementById('result-files');
        const settingsToggle = document.getElementById('settings-toggle');
        const settingsBody = document.getElementById('settings-body');
        const btnModeFiles = document.getElementById('btn-mode-files');
        const btnModeFolder = document.getElementById('btn-mode-folder');

        let selectedFiles = [];
        let currentTaskId = null;
        let pollTimer = null;
        let currentMode = 'files';
        let currentPhase = '';  // 跟踪当前阶段，避免重复重置进度条

        // CPU hint & set default workers
        fetch('/api/cpu').then(r => r.json()).then(d => {
            document.getElementById('cpu-hint').textContent = `(CPU 核心数: ${d.cpu_count})`;
            const workersInput = document.getElementById('workers');
            workersInput.max = d.cpu_count * 2;
            workersInput.value = d.cpu_count;
        }).catch(() => {});

        // Settings toggle
        settingsToggle.addEventListener('click', () => {
            settingsBody.classList.toggle('open');
            settingsToggle.textContent = settingsBody.classList.contains('open') ? '▼ 高级设置' : '▶ 高级设置';
        });

        // Mode switch
        function setMode(mode) {
            currentMode = mode;
            btnModeFiles.classList.toggle('active', mode === 'files');
            btnModeFolder.classList.toggle('active', mode === 'folder');
        }

        // Drop zone click
        dropZone.addEventListener('click', () => {
            if (currentMode === 'folder') folderInput.click();
            else fileInput.click();
        });

        dropZone.addEventListener('dragover', e => { e.preventDefault(); dropZone.classList.add('dragover'); });
        dropZone.addEventListener('dragleave', () => dropZone.classList.remove('dragover'));
        dropZone.addEventListener('drop', e => {
            e.preventDefault();
            dropZone.classList.remove('dragover');
            addFiles(e.dataTransfer.files);
        });
        fileInput.addEventListener('change', () => { addFiles(fileInput.files); fileInput.value = ''; });
        folderInput.addEventListener('change', () => { addFiles(folderInput.files); folderInput.value = ''; });

        function addFiles(files) {
            for (const f of files) {
                if (f.name.toLowerCase().endsWith('.bmp') && !selectedFiles.find(sf => sf.name === f.name)) {
                    selectedFiles.push(f);
                }
            }
            renderFileList();
        }

        function renderFileList() {
            fileList.innerHTML = selectedFiles.map((f, i) => `
                <div class="file-item">
                    <span class="name">📄 ${f.name}</span>
                    <span class="size">${(f.size / 1024).toFixed(1)} KB</span>
                    <span class="remove" onclick="removeFile(${i})">✕</span>
                </div>
            `).join('');

            if (selectedFiles.length > 0) {
                const totalSize = selectedFiles.reduce((s, f) => s + f.size, 0);
                fileCount.style.display = 'block';
                fileCount.innerHTML = `已选择 <strong>${selectedFiles.length}</strong> 个文件，共 ${(totalSize / 1024 / 1024).toFixed(1)} MB`;
                btnConvert.disabled = false;
            } else {
                fileCount.style.display = 'none';
                btnConvert.disabled = true;
            }
        }

        function removeFile(index) {
            selectedFiles.splice(index, 1);
            renderFileList();
        }

        // Convert
        btnConvert.addEventListener('click', () => {
            if (selectedFiles.length === 0) return;

            btnConvert.disabled = true;
            progressSection.classList.add('active');
            resultSection.classList.remove('active');
            progressFill.style.width = '0%';
            progressFill.className = 'progress-bar-fill';
            currentPhase = '';  // 重置阶段

            // Phase: upload
            setPhase('upload');
            document.getElementById('progress-text').textContent = '0 / ?';
            document.getElementById('progress-percent').textContent = '0%';

            const formData = new FormData();
            for (const f of selectedFiles) {
                formData.append('files', f);
            }
            formData.append('compression', document.querySelector('input[name="compression"]:checked').value);
            formData.append('pixel_layout', document.querySelector('input[name="pixel_layout"]:checked').value);
            formData.append('pyramid', document.getElementById('pyramid').checked);
            formData.append('workers', document.getElementById('workers').value);

            const xhr = new XMLHttpRequest();

            xhr.upload.addEventListener('progress', e => {
                if (e.lengthComputable) {
                    const pct = Math.round(e.loaded / e.total * 100);
                    progressFill.style.width = pct + '%';
                    document.getElementById('progress-text').textContent = formatSize(e.loaded) + ' / ' + formatSize(e.total);
                    document.getElementById('progress-percent').textContent = pct + '%';
                }
            });

            xhr.addEventListener('load', () => {
                if (xhr.status >= 200 && xhr.status < 300) {
                    const data = JSON.parse(xhr.responseText);
                    currentTaskId = data.task_id;
                    setPhase('reading');
                    pollTimer = setInterval(() => pollTask(), 300);
                } else {
                    let detail = '转换失败';
                    try { detail = JSON.parse(xhr.responseText).detail || detail; } catch {}
                    alert(detail);
                    btnConvert.disabled = false;
                }
            });

            xhr.addEventListener('error', () => {
                alert('网络错误');
                btnConvert.disabled = false;
            });

            xhr.open('POST', '/api/convert');
            xhr.send(formData);
        });

        function setPhase(phase) {
            if (currentPhase === phase) return;  // 已经在此阶段，不重置
            currentPhase = phase;
            const steps = ['upload', 'reading', 'convert', 'pack', 'download'];
            const labels = {
                upload: '正在上传文件...',
                reading: '正在读取文件...',
                convert: '正在转换图片...',
                pack: '正在打包 ZIP...',
                download: '正在下载 ZIP...',
            };
            const idx = steps.indexOf(phase);

            document.getElementById('phase-label').textContent = labels[phase] || '';

            steps.forEach((s, i) => {
                const el = document.getElementById('phase-' + s);
                if (!el) return;
                el.className = 'phase-step';
                if (i < idx) el.classList.add('done');
                else if (i === idx) el.classList.add('active');
            });

            // Reset bar for new phase
            progressFill.style.width = '0%';
            progressFill.className = 'progress-bar-fill';
            if (phase === 'reading') progressFill.classList.add('orange');
            if (phase === 'pack') progressFill.classList.add('orange');
            if (phase === 'download') progressFill.classList.add('green');
        }

        function formatSize(bytes) {
            if (bytes < 1024) return bytes + ' B';
            if (bytes < 1024 * 1024) return (bytes / 1024).toFixed(1) + ' KB';
            return (bytes / 1024 / 1024).toFixed(1) + ' MB';
        }

        async function pollTask() {
            if (!currentTaskId) return;
            try {
                const resp = await fetch(`/api/task/${currentTaskId}`, { cache: 'no-store' });
                const data = await resp.json();
                console.log('[poll]', data.status, 'progress:', data.progress, 'read_progress:', data.read_progress, 'pack_progress:', data.pack_progress);

                // 排队阶段（刚创建还未开始）
                if (data.status === 'queued') {
                    if (currentPhase !== 'reading') setPhase('reading');
                    document.getElementById('progress-text').textContent = '排队中...';
                    document.getElementById('progress-percent').textContent = '0%';
                    return;
                }

                // 读取阶段
                if (data.status === 'reading') {
                    setPhase('reading');
                    const rDone = data.read_progress || 0;
                    const rTotal = data.total_files || 1;
                    const pct = Math.round(rDone / rTotal * 100);
                    progressFill.style.width = pct + '%';
                    document.getElementById('progress-text').textContent = `${rDone} / ${rTotal}`;
                    document.getElementById('progress-percent').textContent = pct + '%';
                    return;
                }

                // 打包阶段
                if (data.status === 'packing') {
                    setPhase('pack');
                    const pDone = data.pack_progress || 0;
                    const pTotal = data.pack_total || 1;
                    const pct = Math.round(pDone / pTotal * 100);
                    progressFill.style.width = pct + '%';
                    const totalFiles = Math.floor(pTotal / 2);
                    const written = Math.min(pDone, totalFiles);
                    const zipped = Math.max(0, pDone - totalFiles);
                    document.getElementById('progress-text').textContent = `写盘 ${written}/${totalFiles} · 打包 ${zipped}/${totalFiles}`;
                    document.getElementById('progress-percent').textContent = pct + '%';
                    return;
                }

                // 转换阶段
                if (data.status === 'processing') {
                    setPhase('convert');
                    const total = data.total_files;
                    const done = data.progress;
                    const pct = total > 0 ? Math.round(done / total * 100) : 0;
                    progressFill.style.width = pct + '%';
                    document.getElementById('progress-text').textContent = `${done} / ${total}`;
                    document.getElementById('progress-percent').textContent = pct + '%';

                    // 转换全部完成但服务端还没切到 packing，主动切到打包阶段
                    // 不重置进度条，直接切标签
                    if (done >= total && currentPhase !== 'pack') {
                        currentPhase = 'pack';
                        document.getElementById('phase-label').textContent = '正在打包 ZIP...';
                        // 更新步骤条
                        ['upload', 'reading', 'convert'].forEach(s => {
                            document.getElementById('phase-' + s).className = 'phase-step done';
                        });
                        document.getElementById('phase-pack').className = 'phase-step active';
                        progressFill.className = 'progress-bar-fill orange';
                        progressFill.style.width = '0%';
                        document.getElementById('progress-text').textContent = '准备打包...';
                        document.getElementById('progress-percent').textContent = '0%';
                    }
                    return;
                }

                if (data.status === 'done') {
                    clearInterval(pollTimer);
                    btnConvert.disabled = false;

                    statSuccess.textContent = data.success;
                    statFail.textContent = data.fail;
                    btnDownload.href = `/api/download/${currentTaskId}`;

                    resultFiles.innerHTML = data.details.map(d => `
                        <div class="result-file">
                            <span class="name">${d.name}</span>
                            ${d.status === 'ok'
                                ? `<span class="status-ok">✓ 成功</span><a href="/api/download/${currentTaskId}/${d.name}">下载</a>`
                                : `<span class="status-err">✗ ${d.error}</span>`
                            }
                        </div>
                    `).join('');

                    resultSection.classList.add('active');

                    // 确保打包阶段已显示完成再进入下载
                    currentPhase = '';  // 强制允许 setPhase
                    setPhase('pack');
                    progressFill.style.width = '100%';
                    document.getElementById('progress-text').textContent = '打包完成';
                    document.getElementById('progress-percent').textContent = '100%';

                    // Auto download with progress
                    if (data.success > 0) {
                        setTimeout(() => startDownload(currentTaskId, data.zip_size), 300);
                    }
                }
            } catch (e) {
                console.error('[poll] error:', e);
                // 不停止轮询，只记录错误
            }
        }

        function startDownload(taskId, zipSize) {
            setPhase('download');
            const xhr = new XMLHttpRequest();
            xhr.open('GET', `/api/download/${taskId}`, true);
            xhr.responseType = 'blob';

            xhr.addEventListener('progress', e => {
                if (e.lengthComputable) {
                    const pct = Math.round(e.loaded / e.total * 100);
                    progressFill.style.width = pct + '%';
                    document.getElementById('progress-text').textContent = formatSize(e.loaded) + ' / ' + formatSize(e.total);
                    document.getElementById('progress-percent').textContent = pct + '%';
                } else if (zipSize) {
                    // fallback: use server-reported size
                    const pct = Math.min(Math.round(xhr.response.length / zipSize * 100), 99);
                    progressFill.style.width = pct + '%';
                    document.getElementById('progress-percent').textContent = pct + '%';
                }
            });

            xhr.addEventListener('load', () => {
                if (xhr.status >= 200 && xhr.status < 300) {
                    progressFill.style.width = '100%';
                    document.getElementById('progress-percent').textContent = '100%';
                    document.getElementById('phase-label').textContent = '下载完成!';

                    const blob = xhr.response;
                    const url = URL.createObjectURL(blob);
                    const a = document.createElement('a');
                    a.href = url;
                    a.download = 'bmp2tif_converted.zip';
                    document.body.appendChild(a);
                    a.click();
                    document.body.removeChild(a);
                    URL.revokeObjectURL(url);

                    // Mark all phases done
                    ['upload', 'reading', 'convert', 'pack', 'download'].forEach(s => {
                        const el = document.getElementById('phase-' + s);
                        el.className = 'phase-step done';
                    });
                }
            });

            xhr.addEventListener('error', () => {
                document.getElementById('phase-label').textContent = '下载失败，请点击下方按钮手动下载';
            });

            xhr.send();
        }
    </script>
</body>
